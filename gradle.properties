org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
# ForgeGradle 6 is not configuration-cache compatible, and its reobf tasks do not
# round-trip through the build cache. Both stay off on the 1.19.2 branch.
# Minecraft and loader
minecraft_version=1.19.2
minecraft_version_range=[1.19.2,1.19.3)
forge_version=43.5.2
forge_version_range=[43.5.2,44)
loader_version_range=[43,44)
# The mapping channel/version to query. 1.19.2 has no Parchment build in this
# stack, so the official Mojang names are used, matching AE2LT's 1.19.2 branch.
mapping_channel=official
mapping_version=1.19.2
ae2_version=12.9.12
ae2_version_range=[12.9.12,13)
ae2wtlib_version=12.9.7-forge
curios_version=1.19.2-5.1.6.4
jei_version=11.68.0.1087
# Mandatory dependencies of AE2WTLib on 1.19.2.
architectury_version=6.6.92
cloth_config_version=8.3.134
# AE2 Lightning Tech Reborn and Thunderbolt Core Reborn come from Maven Local.
# For local upstream checkouts, use -Puse_local_upstream=true to resolve their
# build/libs Forge jars without changing Maven Local.
ae2lt_version=2.1.2-beta2
ae2lt_version_range=[2.1.0,3.0.0)
thunderbolt_version=2.0.3-beta3
thunderbolt_artifact_id=thunderbolt-reborn-forge-1.19.2
thunderbolt_version_range=[2.0.1,2.1.0)
# Mod metadata
# Keep mod_id aligned with the @Mod annotation.
mod_id=ae2ltpp
mod_name=AE2LT Packaged Pattern Provider
mod_license=GNU LGPL 3.0
mod_version=1.2.2-beta
mod_group_id=com.moakiee.ae2lt.packaged
mod_authors=MOAKIEE,gjmhmm8
mod_description=Packaged Pattern Provider addon for AE2 Lightning Tech.
