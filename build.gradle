buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

version = mod_version
group = mod_group_id

base {
    archivesName = "${mod_id}-forge-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

def stressOptions = [
        stress_trials: [defaultValue: 10000, maximum: 1000000, systemName: 'ae2ltpp.stress.trials'],
        stress_seeds: [defaultValue: 1, maximum: 32, systemName: 'ae2ltpp.stress.seeds'],
        stress_keys: [defaultValue: 3, maximum: 1024, systemName: 'ae2ltpp.stress.keys'],
        stress_soak_rounds: [defaultValue: 10, maximum: 300, systemName: 'ae2ltpp.stress.soak_rounds'],
        stress_rounds: [defaultValue: 300, maximum: 10000, systemName: 'ae2ltpp.stress.rounds']
]
stressOptions.each { name, option ->
    int value = Integer.parseInt((findProperty(name) ?: option.defaultValue).toString())
    if (value < 1 || value > option.maximum) {
        throw new GradleException("${name} must be between 1 and ${option.maximum}")
    }
    option.value = value
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    // Dev-only: Forge ignores access transformers that live inside dependency
    // mod jars, so AE2's has to be supplied by the project for its blocks to
    // load in `runClient`/`runServer`. Not shipped — see the file's header.
    accessTransformer = file('gradle/dev/ae2-dev-accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
            if ((findProperty('disable_early_progress_window') ?: 'false').toBoolean()) {
                jvmArgs '-Dforge.earlyprogresswindow=false'
            }
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            args '--world', 'gametest-world'
            property 'forge.enabledGameTestNamespaces', mod_id
            property stressOptions.stress_soak_rounds.systemName, stressOptions.stress_soak_rounds.value.toString()
            if (project.hasProperty('stress_rounds')) {
                property stressOptions.stress_rounds.systemName, stressOptions.stress_rounds.value.toString()
            }
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all',
                    '--output', file('src/generated/resources/'),
                    '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

def mixinRefmap = layout.buildDirectory.file('tmp/compileJava/compileJava-refmap.json')
def mixinMappings = layout.buildDirectory.file('tmp/compileJava/compileJava-mappings.tsrg')

tasks.named('compileJava', JavaCompile).configure {
    outputs.files(mixinRefmap, mixinMappings)
    outputs.upToDateWhen {
        mixinRefmap.get().asFile.isFile() && mixinMappings.get().asFile.isFile()
    }
}

['jar', 'jarJar'].each { archiveTask ->
    tasks.named(archiveTask, Jar).configure {
        doFirst {
            if (!mixinRefmap.get().asFile.isFile() || !mixinMappings.get().asFile.isFile()) {
                throw new GradleException('Mixin compiler outputs are missing; rerun compileJava before packaging.')
            }
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    if (findProperty('chiseling_reference_maven')) {
        maven {
            name = 'ChiselingTestReferences'
            url = uri(findProperty('chiseling_reference_maven'))
            content { includeGroup 'maven.modrinth' }
        }
    }
    if ((findProperty('use_local_upstream') ?: 'false').toBoolean()) {
        ivy {
            name = 'LocalAE2LTBuild'
            url = uri(findProperty('ae2lt_build_libs') ?: '../AE2-Lightning-Tech 1.20/build/libs')
            patternLayout { artifact '[artifact]-forge-1.20.1-[revision].jar' }
            metadataSources { artifact() }
            content { includeGroup 'com.moakiee.ae2lt' }
        }
        ivy {
            name = 'LocalThunderboltBuild'
            url = uri(findProperty('thunderbolt_build_libs') ?: '../Thunderbolt-Core-main/build/libs')
            patternLayout { artifact 'thunderbolt-forge-1.20.1-[revision].jar' }
            metadataSources { artifact() }
            content { includeGroup 'com.moakiee.thunderbolt' }
        }
    }
    mavenLocal()
    mavenCentral()
    maven {
        url = 'https://modmaven.dev/'
        content {
            includeGroup 'appeng'
            includeGroup 'org.appliedenergistics'
            includeGroup 'mekanism'
            includeGroup 'dev.technici4n'
            includeGroup 'de.mari_023'
        }
    }
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    // Local mirror for Modrinth artifacts whose Maven endpoint serves the
    // Fabric file (the endpoint picks one primary file per version; for
    // multi-loader projects that is not always the Forge build). Jars are
    // published here verbatim, downloaded from the Modrinth CDN.
    maven {
        name = 'LocalModrinth'
        url = uri("${project.gradle.gradleUserHomeDir}/local-modrinth")
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        name = 'Curios'
        url = 'https://maven.theillusivec4.top/'
        content {
            includeGroup 'top.theillusivec4.curios'
        }
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
    }
    maven {
        name = 'Architectury'
        url = 'https://maven.architectury.dev/'
        content {
            includeGroup 'dev.architectury'
        }
    }
    maven {
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me/'
        content {
            includeGroup 'me.shedaniel.cloth'
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation fg.deobf("appeng:appliedenergistics2-forge:${ae2_version}")

    // AE2 Lightning Tech owns the packaged-provider host APIs (frequency binding,
    // wireless provider policy, encoded-pattern validation) plus the wireless
    // connection support types this addon builds on.
    implementation(fg.deobf("com.moakiee.ae2lt:ae2lt:${ae2lt_version}")) {
        // This addon declares its own development runtime. Do not inherit
        // AE2LT's full local-development mod set.
        transitive = false
    }

    // Thunderbolt Core owns the host-neutral overload pattern contract.
    compileOnly(fg.deobf("com.moakiee.thunderbolt:${thunderbolt_artifact_id}:${thunderbolt_version}")) {
        transitive = false
    }
    runtimeOnly(fg.deobf("com.moakiee.thunderbolt:${thunderbolt_artifact_id}:${thunderbolt_version}")) {
        transitive = false
    }

    compileOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}:api")
    if ((findProperty('enable_curios_runtime') ?: 'true').toBoolean()) {
        runtimeOnly fg.deobf("top.theillusivec4.curios:curios-forge:${curios_version}")
    }

    compileOnly fg.deobf("maven.modrinth:applied-energistics-2-wireless-terminals:${ae2wtlib_version}")
    if ((findProperty('enable_ae2wtlib_runtime') ?: 'true').toBoolean()) {
        runtimeOnly fg.deobf("maven.modrinth:applied-energistics-2-wireless-terminals:${ae2wtlib_version}")
        // AE2WTLib declares both as mandatory on 1.20.1.
        runtimeOnly fg.deobf("dev.architectury:architectury-forge:${architectury_version}")
        runtimeOnly fg.deobf("me.shedaniel.cloth:cloth-config-forge:${cloth_config_version}")
    }

    runtimeOnly fg.deobf("org.appliedenergistics:guideme:${guideme_version}")

    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    if ((findProperty('enable_jei_runtime') ?: 'true').toBoolean()) {
        runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
    }
    if ((findProperty('enable_jade_runtime') ?: 'true').toBoolean()) {
        runtimeOnly fg.deobf("curse.maven:jade-324717:${jade_file_id}")
    }

    // MixinExtras ships inside the production jar and joins the dev classpath.
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.4.1")) {
        jarJar.ranged(it, "[0.4.1,)")
    }
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly(fg.deobf("com.moakiee.thunderbolt:${thunderbolt_artifact_id}:${thunderbolt_version}")) {
        transitive = false
    }

    // ============================================================
    // Runtime mods for multiblock adapter integration testing.
    //
    // Every adapter under logic/multiblock/<mod>/ reaches its target mod purely by
    // reflection, so none of these are needed to compile. They stay opt-in so that
    // a plain `gradlew build` does not depend on third-party availability. Enable
    // with -Penable_integration_runtime=true .
    // ============================================================
    // Forge-specific Modrinth version IDs avoid selecting a Fabric/NeoForge file.
    if ((findProperty('enable_maid_runtime') ?: 'false').toBoolean()) {
        runtimeOnly fg.deobf('maven.modrinth:touhou-little-maid:g1SKoGQJ') // Forge 1.20.1 / 1.5.3
    }
    if ((findProperty('enable_chiseling_runtime') ?: 'false').toBoolean()) {
        def chiselingMods = (findProperty('chiseling_runtime_mods') ?: 'chipped,rechiseled').toString().split(',') as Set
        if (chiselingMods.contains('chipped')) {
            runtimeOnly fg.deobf('maven.modrinth:chipped:pi3f4er3')                 // Forge 3.0.7
            runtimeOnly fg.deobf('maven.modrinth:resourceful-lib:OhsHaCcW')         // Forge 2.1.29
            runtimeOnly fg.deobf('maven.modrinth:athena-ctm:DULOQFj7')              // Forge 3.1.2
        }
        if (chiselingMods.contains('rechiseled')) {
            runtimeOnly fg.deobf('maven.modrinth:rechiseled:H9XQzWIp')              // Forge 1.2.6
            runtimeOnly fg.deobf('maven.modrinth:supermartijn642s-core-lib:F4zhN7VF') // Forge 1.1.25
            runtimeOnly fg.deobf('maven.modrinth:supermartijn642s-config-lib:ZKor79dR') // Forge 1.1.8
            runtimeOnly fg.deobf('maven.modrinth:fusion-connected-textures:w0vXLzFW') // Forge 1.3.16
        }
    }
    if ((findProperty('enable_appmek_runtime') ?: 'false').toBoolean()
            || (findProperty('enable_integration_runtime') ?: 'false').toBoolean()) {
        runtimeOnly fg.deobf('maven.modrinth:applied-mekanistics:9n9p68Qq')       // Forge 1.4.3
    }
    if ((findProperty('enable_integration_runtime') ?: 'false').toBoolean()) {
        // Library dependencies shared by multiple target mods. Versions are the
        // actual Modrinth release numbers for the 1.20.1 Forge line (the
        // original pins referenced versions that were never published).
        runtimeOnly fg.deobf("maven.modrinth:cucumber:7.0.16")                    // MA + EC (7.0.7+ fixes the Watering Can sound code loading client classes on dedicated servers)
        runtimeOnly fg.deobf("maven.modrinth:patchouli:1.20.1-84-forge")          // AA + Botania
        runtimeOnly fg.deobf("maven.modrinth:geckolib:4.8.4-forge")               // Occultism + Ars (Forge build; the Maven endpoint serves Fabric for plain 4.8.4)
        runtimeOnly fg.deobf("maven.modrinth:smartbrainlib:1.15")                 // Occultism (1.15 Maven artifact is the Forge-compatible build)
        runtimeOnly fg.deobf("maven.modrinth:modonomicon:1.20.1-1.50.0")          // Occultism (1.60+ changed BookRecipePage's constructor; occultism 1.100.0 pairs with the 1.50 line)
        runtimeOnly fg.deobf("maven.modrinth:codechicken-lib:4.4.0.509")          // DE
        runtimeOnly fg.deobf("maven.modrinth:brandons-core:3.2.1.302")            // DE
        runtimeOnly fg.deobf("maven.modrinth:lodestonelib:1.20.1-1.6.4.1")        // Malum
        runtimeOnly fg.deobf("maven.modrinth:curios:5.14.1+1.20.1")               // Malum + Ars

        // Target mods (one adapter package per mod)
        runtimeOnly fg.deobf("maven.modrinth:actually-subtractions:1.2.14.20+mc1.20.1") // aa/ (Actually Additions 1.20.1 is published under this project)
        runtimeOnly fg.deobf("maven.modrinth:ars-nouveau:4.12.6")                 // ars/
        runtimeOnly fg.deobf("maven.modrinth:natures-aura:39.4")                // naturesaura/
        runtimeOnly fg.deobf("maven.modrinth:mystical-agriculture:7.0.9")         // ma/
        runtimeOnly fg.deobf("maven.modrinth:extended-crafting:6.0.5")            // ec/
        runtimeOnly fg.deobf("maven.modrinth:occultism:1.20.1-1.100.0")           // occultism/
        runtimeOnly fg.deobf("maven.modrinth:draconic-evolution:3.1.2.621")       // de/
        runtimeOnly fg.deobf("maven.modrinth:malum:1.20.1-1.6.7")                 // malum/
        runtimeOnly fg.deobf("maven.modrinth:botania:1.20.1-456-forge")           // botania/
        runtimeOnly fg.deobf("maven.modrinth:blood-magic:3.3.8-50")
        runtimeOnly fg.deobf("maven.modrinth:forbidden-arcanus:1.20.1-2.2.6")
        runtimeOnly fg.deobf("maven.modrinth:valhelsia-core:1.1.2")
        // Plain 1.1.6 on the Modrinth Maven endpoint is the NeoForge build
        // (neoforge.mods.toml only); the Forge 1.20.1 build is mirrored locally.
        runtimeOnly fg.deobf("maven.modrinth:avaritianeo:1.1.6-forge")           // avaritia (AvaritiaNeo split)
        runtimeOnly fg.deobf("maven.modrinth:mekanism:10.4.16.80")                // mekmm/ base
        runtimeOnly fg.deobf("maven.modrinth:mekanismmoremachine:1.20.1-1.2.1")   // mekmm/
    }
}

// Provider persistence tests exercise real Minecraft NBT and registry types,
// so reuse the Minecraft/Forge classpath already available to main.
if ((findProperty('enable_avaritia_tests') ?: 'false').toBoolean()) {
    dependencies {
        testRuntimeOnly fg.deobf("maven.modrinth:avaritianeo:1.1.6-forge")
    }
}

sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath
// Standalone-test stubs must not shadow the real AE2 API in the Gradle suite.
sourceSets.test.java.exclude(
        'appeng/api/crafting/IPatternDetails.java',
        'appeng/api/networking/security/IActionSource.java',
        'appeng/api/stacks/GenericStack.java',
        'appeng/api/stacks/KeyCounter.java')

test {
    useJUnitPlatform()
    stressOptions.each { name, option ->
        systemProperty option.systemName, option.value.toString()
    }
}

// GameTests load structure templates in 1.20.1 from the SNBT folder
// `gameteststructures/` relative to the run directory: the datapack
// `structures/` lookup only accepts compiled binary .nbt, so the text
// templates cannot ship as ordinary resources. Keep the repo copies under
// src/gameteststructures and mirror them into the run directory before any
// dev run that can host game tests.
tasks.register('syncGameTestStructures', Copy) {
    from 'src/gameteststructures'
    include '*.snbt'
    into 'run/gameteststructures'
}

['runClient', 'runServer', 'runGameTestServer'].each { runTask ->
    tasks.matching { it.name == runTask }.configureEach {
        dependsOn 'syncGameTestStructures'
    }
}

// Expand the declared replace properties in the mod metadata resources.
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version        : minecraft_version,
            minecraft_version_range  : minecraft_version_range,
            forge_version            : forge_version,
            forge_version_range      : forge_version_range,
            loader_version_range     : loader_version_range,
            mod_id                   : mod_id,
            mod_name                 : mod_name,
            mod_license              : mod_license,
            mod_version              : mod_version,
            mod_authors              : mod_authors,
            mod_description          : mod_description,
            ae2_version_range        : ae2_version_range,
            ae2lt_version_range      : ae2lt_version_range,
            thunderbolt_version_range: thunderbolt_version_range,
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    archiveClassifier = 'slim'

    from('LICENSE') {
        into 'META-INF'
    }

    // MixinGradle contributes the refmap to production jars, and the dev resource
    // output carries the same file. Keep one copy without weakening duplicate
    // checks for unrelated archive entries.
    filesMatching("${mod_id}.refmap.json") {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }

    manifest {
        attributes([
                'Specification-Title'   : mod_id,
                'Specification-Vendor'  : mod_authors,
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_authors,
                'MixinConfigs'          : "${mod_id}.mixins.json",
        ])
    }

    finalizedBy 'reobfJar'
}

tasks.named('jarJar', Jar).configure {
    archiveClassifier = ''
    from('LICENSE') {
        into 'META-INF'
    }
    finalizedBy 'reobfJarJar'
}

afterEvaluate {
    tasks.findByName('reobfJarJar')?.configure {
        mustRunAfter 'jar'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xmaxerrs' << '5000'
    // Force English javac output so logs stay stable across locales.
    options.fork = true
    options.forkOptions.jvmArgs = ['-Duser.language=en', '-Duser.country=US']
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = mod_id
            artifact(tasks.named('jarJar')) {
                classifier = null
            }
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
