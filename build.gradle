plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = "CurseMaven"
        url = "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        url = "https://modmaven.dev/"
        content {
            includeGroup "de.mari_023"
            includeGroup "dev.technici4n"
            includeGroup "mekanism"
        }
    }
    maven {
        name = "Curios"
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        name = "BlameJared"
        url = "https://maven.blamejared.com/"
        content {
            includeGroup "team.lodestar.lodestone"
            includeGroup "mezz.jei"
            includeGroup "net.mezzdev.config"
        }
    }
    maven {
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
    }
    maven {
        url = "https://maven.createmod.net"
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets {
    batchPortTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath + sourceSets.main.runtimeClasspath
    }
}
configurations {
    batchPortTestImplementation.extendsFrom implementation
    batchPortTestCompileOnly.extendsFrom compileOnly
    batchPortTestRuntimeOnly.extendsFrom runtimeOnly
}

def ae2ltMavenNotation = providers.gradleProperty("ae2lt_maven_notation").orNull
def ae2ltJarPath = providers.gradleProperty("ae2lt_jar").orNull
if (ae2ltJarPath == null || ae2ltJarPath.isBlank()) {
    ae2ltJarPath = providers.gradleProperty("ae2lt_local_jar").orNull
}
if (ae2ltJarPath == null || ae2ltJarPath.isBlank()) {
    ae2ltJarPath = System.getenv("AE2LT_JAR")
}
def ae2ltJarFile = ae2ltJarPath != null && !ae2ltJarPath.isBlank() ? file(ae2ltJarPath) : null

def thunderboltMavenNotation = providers.gradleProperty("thunderbolt_maven_notation").orNull
def thunderboltJarPath = providers.gradleProperty("thunderbolt_jar").orNull
if (thunderboltJarPath == null || thunderboltJarPath.isBlank()) {
    thunderboltJarPath = providers.gradleProperty("thunderbolt_local_jar").orNull
}
if (thunderboltJarPath == null || thunderboltJarPath.isBlank()) {
    thunderboltJarPath = System.getenv("THUNDERBOLT_JAR")
}
def thunderboltJarFile = thunderboltJarPath != null && !thunderboltJarPath.isBlank()
        ? file(thunderboltJarPath)
        : null
// Development-only integrations can be supplied as comma-separated Maven coordinates.
def portOptionalMods = providers.gradleProperty('port_optional_mods').orElse('').get()
        .split(',').collect { it.trim() }.findAll { !it.isBlank() }

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers.add('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        batchPortGameTestServer {
            type = "gameTestServer"
            gameDirectory = project.file('run-batch-port-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', 'ae2ltpp_batch_port_test'
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        if (providers.gradleProperty('ae2ltppBatchPortTest').isPresent()) {
            ae2ltpp_batch_port_test {
                sourceSet(sourceSets.batchPortTest)
            }
        }
    }

    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }
// These optional mods have no verified 26.1.2 builds; keep the adapters in
// source control until their transactional inventory APIs can be tested.
sourceSets.main.java.exclude 'com/moakiee/ae2lt/packaged/logic/multiblock/aa/**'
sourceSets.main.java.exclude 'com/moakiee/ae2lt/packaged/logic/multiblock/ars/**'
sourceSets.main.java.exclude 'com/moakiee/ae2lt/packaged/logic/multiblock/mekmm/**'
sourceSets.test.java.exclude 'com/moakiee/ae2lt/packaged/logic/multiblock/aa/**'
sourceSets.main.resources.exclude 'data/ae2ltpp/recipe/packaged_core/aa_*.json'
sourceSets.main.resources.exclude 'data/ae2ltpp/recipe/packaged_core/ars_*.json'
sourceSets.main.resources.exclude 'data/ae2ltpp/recipe/packaged_core/mekmm_*.json'


dependencies {
    implementation "org.appliedenergistics:appliedenergistics2:26.1.12-beta"
    implementation "de.mari_023:ae2wtlib_api:${ae2wtlib_version}"
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"

    if (thunderboltMavenNotation != null && !thunderboltMavenNotation.isBlank()) {
        compileOnly thunderboltMavenNotation
        runtimeOnly thunderboltMavenNotation
        testRuntimeOnly thunderboltMavenNotation
    } else {
        if (thunderboltJarFile == null || !thunderboltJarFile.exists()) {
            throw new GradleException(
                    "Thunderbolt jar not found. Set 'thunderbolt_jar' in gradle.properties, " +
                            "keep legacy 'thunderbolt_local_jar', or set the THUNDERBOLT_JAR environment variable. " +
                            "Current value: " + (thunderboltJarPath == null ? "<unset>" : thunderboltJarPath))
        }
        compileOnly files(thunderboltJarFile)
        runtimeOnly files(thunderboltJarFile)
        testRuntimeOnly files(thunderboltJarFile)
    }

    if (ae2ltMavenNotation != null && !ae2ltMavenNotation.isBlank()) {
        implementation(ae2ltMavenNotation) {
            // This addon declares its own development runtime. Do not inherit
            // AE2LT's full local-development mod set from Gradle metadata.
            transitive = false
        }
    } else {
        if (ae2ltJarFile == null || !ae2ltJarFile.exists()) {
            throw new GradleException(
                    "AE2LT jar not found. Set 'ae2lt_jar' in gradle.properties, " +
                            "keep legacy 'ae2lt_local_jar', or set the AE2LT_JAR environment variable. " +
                            "Current value: " + (ae2ltJarPath == null ? "<unset>" : ae2ltJarPath))
        }
        implementation files(ae2ltJarFile)
    }

    runtimeOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    runtimeOnly("de.mari_023:ae2wtlib:${ae2wtlib_version}") {
        transitive = false
    }
    runtimeOnly "org.appliedenergistics:guideme:${guideme_version}"
    // Recipe viewers are optional and can be supplied through port_optional_mods.
    portOptionalMods.each { runtimeOnly it }
}

// Provider persistence tests exercise real Minecraft NBT and registry types,
// so reuse the generated Minecraft/NeoForge classpath already available to main.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

def testProjectDirectory = projectDir.absolutePath
test {
    doFirst { workingDir = testProjectDirectory }
    useJUnitPlatform()
}

tasks.named('jar', Jar) {
    from('LICENSE') {
        into 'META-INF'
    }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             ae2lt_version_range    : ae2lt_version_range,
                             thunderbolt_version_range: thunderbolt_version_range,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

apply from: 'gradle/ownership-probe.gradle'
apply from: 'gradle/available-adapter-probe.gradle'
