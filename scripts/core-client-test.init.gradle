// Run core-test.init.gradle + runGameTestServer first to create the disposable world.
// ./gradlew --no-daemon -I scripts/core-test.init.gradle -I scripts/core-client-test.init.gradle runClient
// Supply ppForbiddenJar and ppValhelsiaJar for the FA icon/converter checks.
allprojects {
    afterEvaluate {
        sourceSets.create('coreClientProbe') {
            java.srcDir 'src/coreClientTest/java'
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += output + sourceSets.main.runtimeClasspath
        }
        dependencies.add('coreClientProbeRuntimeOnly', "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")
        dependencies.add('coreClientProbeRuntimeOnly', 'curse.maven:ae2-jei-integration-1074338:7727898')
        configurations.coreClientProbeRuntimeOnly.extendsFrom(configurations.coreTestRuntimeOnly)
        neoForge.mods.ae2ltpp.sourceSet(sourceSets.coreClientProbe)
        neoForge.runs.client {
            sourceSet = sourceSets.coreClientProbe
            gameDirectory = project.layout.buildDirectory.dir('core-client').get().asFile
            programArguments.addAll '--quickPlaySingleplayer', 'CoreQA', '--width', '1200', '--height', '900'
        }
        tasks.named('runClient') {
            doFirst {
                project.file('build/core-client/client-result.txt').delete()
                def options = project.file('build/core-client/options.txt')
                if (!options.exists()) {
                    options.parentFile.mkdirs()
                    options.text = 'onboardAccessibility:false\nlang:zh_cn\npauseOnLostFocus:false\nrenderDistance:3\nsimulationDistance:3\nmaxFps:60\n'
                }
                def save = project.file('build/core-client/saves/CoreQA/level.dat')
                if (!save.exists()) {
                    save.parentFile.mkdirs()
                    save.bytes = project.file('build/core-native/world/level.dat').bytes
                }
            }
            doLast {
                def result = project.file('build/core-client/client-result.txt')
                if (!result.exists() || !result.text.startsWith('PASS')) throw new GradleException('Client probe failed: ' + (result.exists() ? result.text : 'no result'))
            }
        }
    }
}
