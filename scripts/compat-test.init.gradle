// Real Minecraft integration suite. No test classes or recipes enter the release JAR.
// See docs/GAME_TESTS.zh-CN.md for dependencies, coverage and interactive use.
allprojects {
    afterEvaluate {
        configurations.implementation.dependencies.findAll { it.name == 'ae2wtlib_api' }.each { it.transitive = false }
        configurations.runtimeOnly.dependencies.removeIf { dep ->
            (dep.group == 'curse.maven' && dep.name in ['jei-238222', 'jade-324717', 'ae2-jei-integration-1074338']) ||
                (dep.group == 'maven.modrinth' && dep.name == 'justenoughcharacters') ||
                (dep instanceof org.gradle.api.artifacts.FileCollectionDependency &&
                    dep.files.files.any { it.name.startsWith('botania-') })
        }
        def mekmmJar = providers.gradleProperty('ppMekmmJar').orNull
        if (mekmmJar == null || !file(mekmmJar).isFile()) {
            throw new GradleException('Set -PppMekmmJar=/absolute/path/to/mekmm-1.21.1-1.3.3.jar')
        }
        sourceSets.create('compatTest') {
            for (suite in ['batchTest', 'mekRoutingTest', 'refactorTest', 'workbenchTest', 'catalystTest']) {
                java.srcDir "src/${suite}/java"
                resources.srcDir "src/${suite}/resources"
            }
            resources.srcDir 'src/chiselTest/resources'
            compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
            runtimeClasspath += output + sourceSets.main.runtimeClasspath
        }
        dependencies.add('compatTestImplementation', 'mekanism:Mekanism:1.21.1-10.7.19.85')
        dependencies.add('compatTestImplementation', 'curse.maven:applied-mekanistics-574300:7096962')
        dependencies.add('compatTestRuntimeOnly', files(mekmmJar))
        neoForge.mods.ae2ltpp.sourceSet(sourceSets.compatTest)
        // The same tests are available via /test in these opt-in client/server runs.
        for (runName in ['gameTestServer', 'client', 'server']) {
            neoForge.runs.getByName(runName) {
                sourceSet = sourceSets.compatTest
                gameDirectory = project.layout.buildDirectory.dir("compat-${runName}").get().asFile
            }
        }
    }
}
